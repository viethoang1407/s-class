<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="40" fill="#4f46e5"/>
  <g transform="translate(96,88)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Graduation cap top -->
    <polygon points="0,-32 48,0 0,12 -48,0" fill="#ffffff" stroke="none"/>
    <!-- Cap brim line -->
    <line x1="0" y1="-32" x2="0" y2="12"/>
